name: Update profile README

on:
  schedule:
    - cron: "0 0 * * *"
  push:
    paths:
      - "profile/repos.yaml"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Generate profile README
        id: generate
        working-directory: scripts
        env:
          GITHUB_TOKEN: ${{ secrets.ORG_READ_TOKEN }}
        run: |
          uv sync
          uv run generate_profile_readme.py
          cd ..
          if git diff --quiet profile/repos.yaml profile/README.md; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Create pull request
        if: steps.generate.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.REPO_WRITE_TOKEN }}
          branch: chore/sync-org-repos
          title: "chore: sync org repos to profile"
          commit-message: "chore: sync org repos to profile"
          body: |
            ## Org リポジトリの同期

            GitHub API で検出した新しいリポジトリを `profile/repos.yaml` の `未分類` に追加しました。

            ### 対応してください

            - [ ] `未分類` の各 repo を正しいカテゴリへ移動する
            - [ ] `memo` フィールドに説明を記入する
            - [ ] 問題なければこの PR をマージする

            ---
            _このPRは GitHub Actions により自動作成されました。_
          add-paths: |
            profile/repos.yaml
            profile/README.md
